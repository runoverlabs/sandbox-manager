name: codeql

# GitHub's code scanning for the Python CLI and for the workflows themselves
# (script injection, unsafe triggers). Results land in the Security tab. The
# shell scripts are covered by shellcheck in scripts/check.sh; CodeQL has no
# shell extractor.
#
# `pull_request`, never `pull_request_target`: nothing here needs the repo's secrets.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly: new queries also run against old code

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Pinned: with `include:` entries GitHub appends every matrix value to the
    # default job name ("analyze (python, codeql/…)"), and the required status
    # check is "analyze (python)", so it would wait for a job that never reports.
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the SARIF results
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python also runs the code-quality suite (maintainability and
          # reliability, not security) on top of the default queries. Its findings
          # are ordinary code-scanning alerts (Security tab, PR annotations), so
          # this needs neither GitHub's paid Code Quality product nor its managed
          # analysis, which selects files by extension and would miss msbctl.
          # `packs:`, not `queries:`: `queries:` reads `owner/repo:path` as a GitHub
          # repo reference and init fails ("Specifier for external repository is
          # invalid"). `packs:` adds to the default queries instead of replacing them.
          - language: python
            packs: codeql/python-queries:codeql-suites/python-code-quality.qls
          - language: actions
            packs: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Python extractor selects files by the .py extension, and `msbctl` has
      # none. Without this it finds no source and the job fails. Alerts are
      # reported against this copy's path (it is a byte-for-byte copy).
      - name: Expose msbctl to the Python extractor
        if: matrix.language == 'python'
        run: mkdir -p codeql-src && cp msbctl codeql-src/msbctl.py

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          packs: ${{ matrix.packs }}
          build-mode: none

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
