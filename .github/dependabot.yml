# The code is stdlib-only, so the only dependencies are the actions the
# workflows use. They are pinned by commit hash; this keeps the hash and the
# version comment moving together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Do not propose a version the day it is published: a hijacked action
    # release is usually caught and pulled within days, and every action here
    # is pinned by hash, so being a few days late costs nothing.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    # codeql-action's init, analyze and upload-sarif are one release and must
    # match: analyze refuses a config written by another version's init. Apart,
    # each gets its own PR, and none of them can pass CI alone.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
