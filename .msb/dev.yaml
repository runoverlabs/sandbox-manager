# .msb/dev.yaml — the image for this project's sandbox. COMMIT THIS FILE.
#
# Read by msbctl for the `image:` line only, and never passed to msb (see
# templates/dev.yaml.in for why). The cpus, memory and workdir below are what
# an older `msbctl add` wrote: accepted, and ignored. The real values are in
# ./sandbox.toml and the registry entry.

# Pinned tag@digest: a tag moves, a digest does not. `msbctl add` resolves
# the digest for a tag, and `msbctl show` reports when a newer one exists.
# yamllint disable-line rule:line-length
image: mcr.microsoft.com/devcontainers/base:ubuntu@sha256:edfb983aab9c579a385dc23c57d7d3703f5ec920124d99c16204a2cac465aab4

cpus: 4
# A ceiling, not a reservation: ~300 MB idle. Page cache does park against it
# and is never returned on its own — `msbctl reclaim sandbox-manager` is the fix.
memory: "8G"

workdir: /work
