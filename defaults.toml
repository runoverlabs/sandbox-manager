# defaults.toml — the settings msb-manager ships. Do not edit this file.
#
# It is read straight from the repo checkout, so `git pull` updates it. Your own
# choices go in ~/.config/msb/config.toml, which is merged OVER this one:
#
#   tables (like [defaults] or [env]) merge key by key, so setting one value
#       locally leaves the rest of the shipped table alone;
#   anything else — a string, a number, a list — is replaced whole. That
#       includes an egress group: redefining `github` locally replaces it
#       entirely rather than splicing host lists together, which is deliberate,
#       because rule order matters and half a group is worse than either.
#
# A group name that does not exist here (your own `my-servers`) is simply added.
# `msbctl config` prints the merged result and says which side each value is from.
#
# Read with Python's stdlib tomllib. msbctl never writes this file.

[defaults]
# Where projects live. A BARE NAME at `msbctl add` resolves inside this:
#
#   msbctl add myproject       ->  ~/workspaces/myproject
#
# Anything that states a location is taken as written, so a project outside
# the workspaces is still one argument:
#
#   msbctl add /srv/thing      absolute
#   msbctl add ~/src/thing     home-relative
#   msbctl add ./thing         explicitly relative to the CWD, not here
#
# `./` is honoured as a deliberate statement — typing it is how you say "the
# one here". Set to "" to resolve bare names against the CWD instead.
workspaces = "~/workspaces"

# Where a new sandbox mounts its project, unless `msbctl add` is told
# otherwise: "/work", "host" for the host's own path (absolute paths in errors
# and agent output then work on both sides), or any absolute path. Each
# sandbox records its own as `guest_path` in its registry entry.
guest_path = "/work"

# Pinned tag@digest. Pinning by digest is the point: a tag moves, a digest does
# not, and a sandbox whose base image changed under it is a debugging session
# nobody wanted. `msbctl add` offers to resolve the digest for you.
image = "mcr.microsoft.com/devcontainers/base:ubuntu@sha256:edfb983aab9c579a385dc23c57d7d3703f5ec920124d99c16204a2cac465aab4"

cpus = 4
# A ceiling, not a reservation: ~300 MB idle. Guest page cache parks against it
# and is never returned on its own — `msbctl reclaim` is the fix.
memory = "8G"

# CLI only; `root_disk` is not a config field msb accepts. The default writable
# layer is ~3.9 GiB, which `npm ci` can exhaust.
root_disk = "16G"

# The disk volume a sandbox cloned from a repo (`msbctl add --repo`) keeps its
# clone on. Created once, at the first create, and kept across rebuilds —
# that is what lets a rebuild keep unpushed work — then deleted by purge.
# msbctl never resizes it: a volume's size is fixed when it is made.
workspace_disk = "20G"

# Rule groups every sandbox gets on top of `base`, unless its own entry
# overrides. `base` is always emitted first and is not listed here.
rule_groups = ["github", "claude"]

# "enforce" — deny by default; only the rule groups below get through. This is
#             the point of the tool and what every sandbox should sit at.
# "observe"  — NOTHING IS BLOCKED. Egress is unrestricted and every host the
#             sandbox reaches is written to its runtime.log, for
#             `msbctl observe <name>` to read back.
#
# Observe exists because msb will not tell you what it DENIED: it logs what it
# allows and is silent about the rest, at every log level (re-checked on 0.7.7
# at --debug and --trace). So there is no "warn but permit" to switch on, and
# the only way to learn what a sandbox actually needs is to let it through and
# write down where it went. The intended use is a round trip, not a setting:
#
#   msbctl observe <name> on --rebuild     stop blocking, start recording
#   …use the sandbox normally for a while…
#   msbctl observe <name>                  every host it reached
#   msbctl allow <name> <the ones that belong>
#   msbctl observe <name> off --rebuild    back to deny-by-default
#
# What it costs while it is on: the sandbox can reach anywhere, so anything it
# can read it can send. Secrets are NOT exposed — substitution stays host-side
# and bound to its named hosts — but deny-by-default is the thing standing
# between an agent and the open internet, and this takes it away. DNS rebind
# protection comes off with it, because a dropped answer is a block like any
# other and leaves nothing to record.
#
# Per sandbox, not here, unless you really mean every sandbox on this machine:
# `msbctl observe <name> on`, or the 'Egress rules' section of `msbctl edit`.
# Create-time like the rules themselves, so changing it needs a rebuild.
egress_mode = "enforce"

# Groups whose names resolve to PRIVATE addresses. `msbctl add` sets
# allow_private_dns = true in a project that selects one of these, because
# such a group does not work without it and the failure reads as a missing
# egress rule rather than as a DNS one.
private_dns_groups = []

# "secret" — bind CLAUDE_CODE_OAUTH_TOKEN with --secret and give the sandbox
#            its own ~/.claude. The real credential never enters the VM.
# "mount"  — bind-mount the host's ~/.claude and ~/.claude.json. Shared
#            history, but every sandbox then holds your real Claude
#            credentials and every project's transcripts.
#
# Set to "mount" only if spikes/07-claude-token-secret.sh fails.
claude_auth = "secret"

# Which stored Claude token (by name, `msbctl setup` → Claude login) a sandbox
# uses unless its registry entry names another. "main" is the plain
# CLAUDE_CODE_OAUTH_TOKEN in secrets/global.env, i.e. a token stored before
# tokens had names. `msbctl setup` sets this when you choose a default.
claude_token = "main"

# Which [identities] entry (defined in your local config.toml) a new sandbox
# gets unless its registry entry says
# otherwise. Set to "" for none, and `git commit` then needs an identity from
# the repo itself.
identity = ""

# How a sandbox's git reaches GitHub, unless its registry entry says otherwise
# (`msbctl edit <name>` → Git push). Applied on every start, in the guest's
# --system git config, never the repo's own:
#   "gh"   https for fetch and push, an ssh origin rewritten to https, with the
#          GitHub token's placeholder handed over by gh's credential helper.
#   "ssh"  push over ssh through the forwarded agent, offering github.com only
#          the identity's push_key.
# gh does PRs, Actions and the API either way. A sandbox cloned from a repo
# (`add --repo`) has no agent and is always written with "gh".
git_push = "gh"

[identities]

# Guest environment, emitted as `--env KEY=value` at create time. Every sandbox
# gets these; a project's .msb/sandbox.toml [env] table MERGES over them rather
# than replacing, so adding one variable there keeps this set.
#
# Fixed at create time like mounts and rules — changing anything here needs
# `msbctl rebuild`, not a restart.
#
# Do not also set one of these keys in a project's dev.yaml `env:` block. Which
# of the two wins is unverified, and a telemetry switch whose effective value
# depends on an unverified precedence is worse than one set in a single place.
[env]
# The Claude Code opt-outs are in [agent_env.claude] below, applied only where
# Claude is installed. These are for every sandbox.
#
# This is also what keeps the egress allowlist honest: `base` contains no
# telemetry hosts, and the reason it needs none is that the traffic is turned
# off here and there. Allowing a telemetry host later would be widening the list
# for something deliberately disabled — fix it here instead.
#
# Not Claude-specific — the cross-vendor opt-out convention, honoured by a
# number of the CLIs a sandbox is likely to grow.
DO_NOT_TRACK = "1"
# A terminal editor for anything that launches one: Claude Code's /memory and
# ctrl-g, `git commit`, crontab. With neither EDITOR nor VISUAL set, Claude Code
# falls back to whatever it finds on PATH — in the devcontainers image that is
# `code`, VS Code's launcher, which has no window to talk to inside the VM and
# exits silently, so /memory appears to do nothing. nano is installed by
# bootstrap.sh so this holds on any image. Override per project in [env].
EDITOR = "nano"

# Guest environment for a coding agent, emitted only into sandboxes that install
# it (an agent ticked in `msbctl add`; for Claude, unless [bootstrap] claude =
# false). Applied UNDER every [env] table, so any of them can still override a
# key, and fixed at create time in the same way: `msbctl rebuild` to change one.
# Your config.toml merges over this key by key, like [env].
[agent_env.claude]
# Telemetry, error reporting and the feedback paths, all off. NONESSENTIAL_TRAFFIC
# alone implies most of them; each is still set by name, so none depends on
# what the umbrella happens to imply in a given release. Turning telemetry off also turns off feature-flag
# evaluation (GrowthBook), so DISABLE_GROWTHBOOK is not needed.
DISABLE_TELEMETRY = "1"
CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1"
DISABLE_ERROR_REPORTING = "1"
DISABLE_FEEDBACK_COMMAND = "1"
# The older name of /feedback (/bug); still read.
DISABLE_BUG_COMMAND = "1"
CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY = "1"
# `msbctl update` installs Claude Code and records the version, so a rebuild
# reproduces it. An auto-update would drift away from that record unseen.
DISABLE_AUTOUPDATER = "1"
# Tells Claude Code (and claude-agent-acp, the adapter editors like Zed use)
# that it is already inside a sandbox. It runs as root here, and both refuse
# bypass-permissions mode (--dangerously-skip-permissions) for root unless this
# is set. The VM is the boundary — egress allowlist, placeholder credentials —
# so the mode is offered; it is still never on unless you pick it. To withhold
# it, set IS_SANDBOX = "" in an [env]: the adapter treats any non-empty value,
# "0" included, as set.
IS_SANDBOX = "1"

[versions]
# Defaults for bootstrap.sh. A sandbox entry's [versions] table overrides these
# per component, which is also where `msbctl update` records what it installed
# so that a later rebuild reproduces it rather than silently reverting.
node     = "22"
gitleaks = "8.30.1"
gh       = "2.102.0"
bun      = "1.4.2"

[version_check]
# Unauthenticated api.github.com is 60 requests/hour per IP and this probes
# three repositories per refresh. Cached in ~/.local/state/msb/versions.json.
ttl_hours = 6
# Used host-side for the release lookups if a GH_TOKEN is present in
# secrets/global.env. Nothing breaks without it; the probes just count against
# the anonymous quota.
use_global_token = true

# ---------------------------------------------------------------------------
# Kandev hosts
#
# This machine as a sandbox host for Kandev (`msbctl kandev …`, driven over ssh
# by the Kandev plugin through `msbctl host serve --kandev`). Off unless
# enabled here or in config.toml. Every limit counts Kandev's sandboxes only;
# yours are outside the budget, and no kandev verb can see or touch them.
# Nothing in a Kandev request can raise these limits or remove a base rule.
# See the "Kandev hosts" page of the docs.
# ---------------------------------------------------------------------------
[kandev]
enabled       = false
max_sandboxes = 12
max_cpus      = 32               # summed over Kandev's sandboxes that exist
max_memory    = "96G"
# Host ports published on 127.0.0.1, four per sandbox (agentctl's control port
# and its three instance ports). Nothing off this machine reaches them directly.
port_pool     = "20000-29999"
# The HTTPS address Kandev reaches this host's sandboxes at, e.g.
# "https://sbx-01.tailnet.ts.net". A lease is this plus /vm/<name>/p/<port>.
base_url      = ""
# What serves base_url: "tailscale" maps each sandbox port with
# `tailscale serve --set-path`, using the node's own certificate (grant it once:
# `sudo tailscale set --operator=$USER`); "none" leaves routing to you.
serve         = "tailscale"
# Egress every Kandev sandbox gets ("base" is always first). The Kandev API
# host is added per sandbox from the request, pinned to the address it resolves
# to here, so DNS rebind protection stays on.
rule_groups   = ["github", "npm", "python", "claude"]
# What a profile's extra egress may add, as hostname patterns ("pypi.org",
# "*.example.com"). Empty allows nothing extra, as everywhere else in this file;
# ["*"] trusts whatever the Kandev server's profiles ask for.
allow_extra   = []

# ---------------------------------------------------------------------------
# Egress rule groups
#
# Each group is justified in place below. Three properties govern all of them
# and are each easy to get backwards:
#
#   RULES ARE FIRST-MATCH-WINS. A leading deny cannot be undone by appending an
#   allow later. `base` is therefore always emitted first, before any group a
#   sandbox asks for.
#
#   A HOSTNAME RULE ONLY MEANS A HOSTNAME OVER HTTPS. On :443 the interceptor
#   reads the SNI, so a pool of addresses behind one name is fine. On any other
#   port nothing inspects the traffic and the rule is enforced as "the
#   addresses that name resolved to", which breaks against address pools. That
#   is why :80 is denied outright and why anything failing should be fixed with
#   its https:// URL, never with a :80 allow. An IP rule on :80 is precise.
#
#   DNS RESOLUTION IS PART OF THE RULE, not a separate concern. msb permits a
#   connection based on addresses IT resolved from the allowed names, so a name
#   it cannot resolve fails identically to one you never allowed — NXDOMAIN in
#   the guest and the connect refused. See `allow_private_dns` in a project's
#   sandbox.toml, and spikes/10-private-dns.sh.
#
# Build these from observed denials, not from guesses: a list assembled by
# guessing is either too tight to work or so wide it gives back what
# deny-by-default bought. bootstrap.sh reports every failure at once so that
# building the list is one round trip rather than a series of them.
# ---------------------------------------------------------------------------
[rules]

# Always applied, always first. Not nameable in a sandbox entry, and nothing a
# project writes can precede it — group rules and then `extra_rules` are
# appended after. That is deliberate, and it has one consequence worth knowing:
#
#   A PLAINTEXT ALLOW CANNOT BE ADDED FROM A PROJECT. An IP rule on :80 is
#   still precise and would be safe, but first-match-wins means the deny below
#   has already matched by the time a project's rule is considered. Such a rule
#   has to go in this list, above the deny, where adding it is a visible change
#   to shared policy rather than a line in one repo. If you find yourself
#   wanting one, check first whether the https:// URL works — it almost always
#   does, and that is the better fix.
base = [
    "allow@dns",
    "deny@public:tcp:80,deny@private:tcp:80",
    # The apt sources rewrite in bootstrap.sh is what makes this precise: it
    # moves apt to HTTPS before the first fetch, so the rule is enforced on the
    # SNI rather than on whichever mirror a plaintext request reached.
    "allow@*.ubuntu.com:tcp:443",
]

github = [
    "allow@github.com:tcp:443",
    # For SSH remotes. This is the weak kind of hostname rule — nothing
    # inspects SSH, so it resolves to pinned addresses — but github.com has a
    # single address, so the pool problem does not apply.
    #
    # Do NOT substitute ssh.github.com:443 to "get a strong rule". TLS
    # interception is on for :443 and SSH is not TLS; the interceptor would be
    # handed a protocol it cannot parse.
    "allow@github.com:tcp:22",
    "allow@api.github.com:tcp:443",
    "allow@codeload.github.com:tcp:443",
    "allow@objects.githubusercontent.com:tcp:443",
    # Release downloads redirect here, not to objects.*. gh and gitleaks both
    # come through it.
    "allow@release-assets.githubusercontent.com:tcp:443",
    "allow@raw.githubusercontent.com:tcp:443",
    # Where `gh run view --log` / `--log-failed` fetch Actions logs from; without
    # it they fail with "connection refused" and CI failures can't be read here.
    "allow@results-receiver.actions.githubusercontent.com:tcp:443",
    # `gh attestation verify` needs both: Sigstore's TUF trust root, and the
    # signed bundle, which the attestations API points at in GitHub's own blob
    # storage account. That account name is GitHub's to change; if verification
    # starts failing with a refused blob.core.windows.net host, update it.
    "allow@tuf-repo-cdn.sigstore.dev:tcp:443",
    "allow@tmaproduction.blob.core.windows.net:tcp:443",
]

npm = [
    "allow@registry.npmjs.org:tcp:443",
    "allow@deb.nodesource.com:tcp:443",
]

# bun comes from a pinned, checksum-verified GitHub release asset (the same as
# gh and gitleaks), not bun.sh. Release downloads redirect to
# release-assets.githubusercontent.com. Listed here rather than relying on the
# `github` group so a sandbox with bun and no other GitHub need still works.
bun = [
    "allow@github.com:tcp:443",
    "allow@release-assets.githubusercontent.com:tcp:443",
]

# Claude Code contacts BOTH. api.anthropic.com carries inference;
# platform.claude.com is hit on startup, and without it the CLI refuses to
# start at all with "Unable to connect to Anthropic services", which reads
# as an outage rather than as a missing egress rule.
claude = [
    "allow@api.anthropic.com:tcp:443",
    "allow@platform.claude.com:tcp:443",
]

python = [
    "allow@pypi.org:tcp:443",
    "allow@files.pythonhosted.org:tcp:443",
]

rust = [
    "allow@crates.io:tcp:443",
    "allow@index.crates.io:tcp:443",
    "allow@static.crates.io:tcp:443",
]

# Registries podman pulls from. Docker Hub needs THREE hosts: the registry, the
# token service, and the CDN that actually serves layer blobs. Missing the last
# one fails only after auth and manifests succeed, mid-pull, as "connection
# refused" on production.cloudfront.docker.com. Codeberg's registry is
# codeberg.org itself (Forgejo serves its packages and their blobs from the
# same host). mcr.microsoft.com is where the devcontainers images (the default
# image) come from. Add quay.io etc. as you need.
containers = [
    "allow@registry-1.docker.io:tcp:443",
    "allow@auth.docker.io:tcp:443",
    "allow@index.docker.io:tcp:443",
    "allow@production.cloudfront.docker.com:tcp:443",
    "allow@ghcr.io:tcp:443",
    "allow@pkg-containers.githubusercontent.com:tcp:443",
    "allow@codeberg.org:tcp:443",
    "allow@mcr.microsoft.com:tcp:443",
]

go = [
    "allow@proxy.golang.org:tcp:443",
    "allow@sum.golang.org:tcp:443",
    # The Go vulnerability database, which govulncheck reads.
    "allow@vuln.go.dev:tcp:443",
]

# `playwright install` downloads its browser builds from here, for the npm and
# the Python package alike. Playwright falls back to other mirrors when this
# one fails; add one only once it shows up as refused. `install --with-deps`
# also apt-installs the browsers' system libraries, from the Ubuntu mirrors
# that are already allowed.
playwright = [
    "allow@cdn.playwright.dev:tcp:443",
]

# ---------------------------------------------------------------------------
# Secret presets
#
# What `msbctl add` and `msbctl secret add` offer. A secret is a variable the
# sandbox can USE but never SEE: it gets a placeholder, and msb substitutes the
# real value on egress, only to `hosts`, in headers (HTTP Basic auth included —
# that is what makes registry logins work). The value is stored per sandbox in
# ~/.config/msb/secrets/<name>.env, never here.
#
# `hosts` must ALSO be reachable: a secret does not open the network. Docker
# Hub and ghcr.io are in the `containers` egress group; pypi upload is not.
#
# msbctl adds `passthrough=` for the coding agent's own endpoints to every
# binding, and you want that: msb kills any request carrying a placeholder in
# its BODY, and an agent that has once seen `$MSB_<VAR>` carries it in every
# request from then on — which arrives as ECONNRESET naming nothing. Passthrough
# only lets the placeholder text travel; the real value stays headers-only and
# goes to `hosts` and nowhere else.
#
# Add your own with a [secret_presets.<name>] table in your local config.toml.
# ---------------------------------------------------------------------------
[secret_presets.npm]
env   = "NPM_TOKEN"
hosts = ["registry.npmjs.org"]
help  = "https://www.npmjs.com/settings/~/tokens  (a granular, read-only token if you only install)"
usage = "echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' >> ~/.npmrc"

[secret_presets.dockerhub]
env   = "DOCKERHUB_TOKEN"
hosts = ["registry-1.docker.io", "auth.docker.io"]
help  = "https://app.docker.com/settings/personal-access-tokens"
usage = 'podman login docker.io -u YOURUSER -p "$DOCKERHUB_TOKEN"'

[secret_presets.ghcr]
env   = "GHCR_TOKEN"
hosts = ["ghcr.io"]
help  = "https://github.com/settings/tokens  (classic, read:packages / write:packages)"
usage = 'podman login ghcr.io -u YOURUSER -p "$GHCR_TOKEN"'

[secret_presets.pypi]
env   = "PYPI_TOKEN"
hosts = ["upload.pypi.org"]
help  = "https://pypi.org/manage/account/token/"
usage = 'twine upload -u __token__ -p "$PYPI_TOKEN" dist/*'

[secret_presets.crates]
env   = "CARGO_REGISTRY_TOKEN"
hosts = ["crates.io"]
help  = "https://crates.io/settings/tokens"
usage = "cargo publish   (cargo reads CARGO_REGISTRY_TOKEN itself)"
